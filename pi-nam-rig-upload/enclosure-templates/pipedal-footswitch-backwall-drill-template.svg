<svg xmlns="http://www.w3.org/2000/svg" width="222mm" height="140mm" viewBox="0 0 222 140">
  <!-- PRINT AT 100% / "ACTUAL SIZE" — NOT "FIT TO PAGE". Measure the 50mm
       calibration bar with a ruler after printing before trusting this.

       Back wall of the footswitch box: 222mm wide x 55mm tall (nominal
       HB5050 wall height). This SVG is 140mm tall because it includes an
       85mm strip below the wall for a visible orientation banner, the
       calibration bar, notes, and drill-bit legend. Solid black dots
       mark the exact center of each hole for center-punching.

       ORIENTATION — CORRECTED 2026-09-12, previous version had this backwards:
       This drawing is the TRUE view from OUTSIDE the enclosure, standing behind the box looking
       at the back wall. That means X is MIRRORED relative to the lid template's page layout —
       increasing X (toward TUNER/MUTE) is drawn going LEFT here, not right. Why: on the lid
       template, "right" matches the player's own right hand when they stand at the front looking
       toward the back (facing away from themselves). To look at the OUTSIDE of the back wall you
       have to stand behind the box facing the OPPOSITE direction (facing the box), so your right
       and left swap relative to that same X-axis. Dimension labels still cite the SAME physical X
       values as pipedal-footswitch-drill-template.svg (e.g. the connector is still "X=170") —
       only the drawing position is mirrored so left/right looks correct when you're actually
       standing outside behind the box holding this printout up to the panel. Tape it to the back
       wall's OUTSIDE surface, matching how the connector's flange also sits flush against that
       face (its body protrudes inward, behind the panel).

       Connector: USB-A female-to-female D-series panel-mount coupler
       (Amazon AU, tunghey / ASIN B0D77L812F). Dimensions read directly
       off that listing's own dimension diagram, not estimated:
         - Flange: 26 x 31mm
         - Round bore for the barrel: (dia)23.7mm
         - 2x mounting screws: (dia)3.4mm, M3, diagonal D-pattern,
           19mm horizontal x 24mm vertical apart
         - Body depth behind the panel: 28.6mm

       Position: X=170 (NOT centered on the wall) — this is the real physical X, same coordinate
       frame as the lid template, drawn here at page position 222-170=52 per the mirror above.
       Checked the 3D clearance between this connector's 28.6mm protrusion and the OLED module
       hanging down from the lid (per pipedal-hardware-v2.md §2.1-2.3): centering this connector
       at X=111 like the OLED puts them only 1.9mm apart, smaller than the wall-thickness
       uncertainty already flagged elsewhere. X=170 sits in the clear gap between the OLED's
       footprint (X 75-147) and TUNER/MUTE, giving comfortable real clearance instead.

       RE-CHECKED 2026-09-12 against the corner-post fix in pipedal-hardware-v2.md §2.1: TUNER/MUTE
       moved from X=202 to X=198 to clear an internal lid-mounting boss found inside the physical
       chassis. This connector's X=170 still holds — ~10mm clearance to the OLED, ~9mm to
       TUNER/MUTE (using its round body, the only part of the switch stack whose height overlaps
       this connector's own Z-range — see the projected TUNER/MUTE profile drawn on this sheet
       below). Z kept centered on the wall height (27.5) since the X position alone resolves it. -->

  <style>
    text { font-family: sans-serif; }
    .hole { fill: none; stroke: black; stroke-width: 0.3; }
    .panel { fill: none; stroke: black; stroke-width: 0.5; }
    .dim { stroke: black; stroke-width: 0.15; }
    .dimtext { font-size: 3.2px; fill: black; }
    .label { font-size: 3px; fill: black; }
    .note { font-size: 3px; fill: black; }
    .bg { fill: white; }
    .punch { fill: black; }
    .legend text { font-size: 3px; fill: black; }
    .legend .hdr { font-size: 3.2px; font-weight: bold; }
    .bannerhdr { font-size: 3.2px; font-weight: bold; fill: black; }
    .ref { fill: none; stroke: black; stroke-width: 0.3; stroke-dasharray: 1.2,0.8; }
  </style>

  <!-- back wall outline, 222 x 55mm -->
  <rect class="panel" x="0" y="0" width="222" height="55"/>

  <!-- centerlines. Page position = 222 - true X. Connector true X=170 -> page x=52. -->
  <line class="dim" x1="52" y1="0" x2="52" y2="55" stroke-dasharray="1,1"/>
  <line class="dim" x1="0" y1="27.5" x2="222" y2="27.5" stroke-dasharray="1,1"/>

  <!-- main bore, dia 23.7mm, true X=170 -> page x=52 -->
  <circle class="hole" cx="52" cy="27.5" r="11.85"/>
  <circle class="punch" cx="52" cy="27.5" r="0.4"/>
  <text class="label" x="40" y="10" text-anchor="start">USB coupler bore ⌀23.7 (true X=170)</text>

  <!-- flange outline for reference, 26 x 31mm. True X span 157-183 -> page span 39-65 -->
  <rect class="hole" x="39" y="12" width="26" height="31" stroke-dasharray="0.6,0.6"/>
  <text class="label" x="83" y="27.5" text-anchor="start">flange 26x31 (ref only,</text>
  <text class="label" x="83" y="31" text-anchor="start">not a cut line)</text>

  <!-- 2 mounting screw holes, dia 3.4mm, diagonal D-pattern, 19 x 24mm apart.
       True X 160.5/179.5 -> page x 61.5/42.5 -->
  <circle class="hole" cx="42.5" cy="15.5" r="1.7"/>
  <circle class="punch" cx="42.5" cy="15.5" r="0.4"/>
  <circle class="hole" cx="61.5" cy="39.5" r="1.7"/>
  <circle class="punch" cx="61.5" cy="39.5" r="0.4"/>
  <text class="label" x="42.5" y="12.5" text-anchor="middle">⌀3.4</text>
  <text class="label" x="61.5" y="44" text-anchor="middle">⌀3.4</text>

  <!-- dimension: 19mm horizontal between screw holes -->
  <g class="dim">
    <line x1="61.5" y1="44" x2="61.5" y2="47"/>
    <line x1="42.5" y1="44" x2="42.5" y2="47"/>
    <line x1="42.5" y1="45.5" x2="61.5" y2="45.5"/>
  </g>
  <rect class="bg" x="43" y="44" width="18" height="3.4"/>
  <text class="dimtext" x="52" y="46.7" text-anchor="middle">19.0</text>

  <!-- dimension: 24mm vertical between screw holes, drawn just left of the flange now -->
  <g class="dim">
    <line x1="35" y1="15.5" x2="32" y2="15.5"/>
    <line x1="35" y1="39.5" x2="32" y2="39.5"/>
    <line x1="33.5" y1="15.5" x2="33.5" y2="39.5"/>
  </g>
  <text class="dimtext" x="31" y="28.5" text-anchor="end">24.0</text>

  <!-- centering dimension: distance from the RESET-side edge (true X=0, page x=222) to the
       connector center (true X=170, page x=52) = 170.0mm -->
  <g class="dim">
    <line x1="218" y1="5" x2="52" y2="5"/>
    <line x1="218" y1="3" x2="218" y2="7"/>
    <line x1="52" y1="3" x2="52" y2="7"/>
  </g>
  <rect class="bg" x="129" y="3.3" width="16" height="3.4"/>
  <text class="dimtext" x="137" y="6" text-anchor="middle">170.0</text>

  <!-- wall-height centerline dimension, moved to the left side (now the open side) -->
  <g class="dim">
    <line x1="10" y1="0" x2="10" y2="27.5"/>
    <line x1="8" y1="0" x2="12" y2="0"/>
    <line x1="8" y1="27.5" x2="12" y2="27.5"/>
  </g>
  <rect class="bg" x="4.5" y="12" width="11" height="3.4"/>
  <text class="dimtext" x="10" y="14.7" text-anchor="middle">27.5</text>

  <!-- ============ TUNER/MUTE profile, projected from the LID (reference only, not on this
       panel) — shows the X (mirrored, true X=198 -> page X=24) and Z extent of its below-panel
       stack, confirming it doesn't reach the coupler. Page_y = 55 - Z (top of drawing = lid/
       hinge at Z=55, bottom = floor at Z=0). Only the body (Z39-52, radius 6mm, matching the
       round thread/hole) is close enough in Z to matter — the wider washer (Z52-55) sits well
       above the coupler's own Z-range and never gets close in this view. ============ -->
  <rect class="ref" x="16" y="0" width="16" height="3"/>
  <rect class="ref" x="18" y="3" width="12" height="13"/>
  <rect class="ref" x="21" y="16" width="6" height="4"/>
  <text class="label" x="1" y="32" text-anchor="start">TUNER/MUTE</text>
  <text class="label" x="1" y="35.5" text-anchor="start">(from lid, ref)</text>
  <g class="dim">
    <line x1="30" y1="20" x2="30" y2="23"/>
    <line x1="39" y1="20" x2="39" y2="23"/>
    <line x1="30" y1="21.5" x2="39" y2="21.5"/>
  </g>
  <text class="dimtext" x="34.5" y="19" text-anchor="middle">9.0</text>

  <!-- ============ Visible orientation banner ============ -->
  <rect class="panel" x="0" y="57" width="222" height="23"/>
  <text class="bannerhdr" x="3" y="61.5">ORIENTATION — read before marking (corrected 2026-09-12):</text>
  <text class="note" x="3" y="65.5">TRUE view from OUTSIDE, standing behind the box facing it — tape this sheet to the back wall's</text>
  <text class="note" x="3" y="69.5">outside face; do not mirror or flip it further. This is already the mirror of the lid template.</text>
  <text class="note" x="3" y="73.5">X increases to the LEFT here (toward TUNER/MUTE), opposite of the lid template, because you face</text>
  <text class="note" x="3" y="77.5">the opposite direction to view this wall's outside — labels still cite the same true X values.</text>

  <!-- Calibration bar + notes -->
  <line x1="20" y1="87" x2="70" y2="87" stroke="black" stroke-width="0.5"/>
  <line x1="20" y1="84" x2="20" y2="90" stroke="black" stroke-width="0.5"/>
  <line x1="70" y1="84" x2="70" y2="90" stroke="black" stroke-width="0.5"/>
  <text class="note" x="45" y="94" text-anchor="middle">50mm — measure this line after printing to confirm scale</text>

  <text class="note" x="90" y="82">Positioned off-center (true X=170, not 111) on purpose: at X=111 this connector's</text>
  <text class="note" x="90" y="87">28.6mm protrusion clears the OLED module hanging down from the lid by only</text>
  <text class="note" x="90" y="92">1.9mm — smaller than the wall-thickness uncertainty already flagged elsewhere.</text>
  <text class="note" x="90" y="97">X=170 sits in the clear gap between the OLED and TUNER/MUTE with real margin.</text>
  <text class="note" x="90" y="102">Still verify this in person once you have both the enclosure and the connector —</text>
  <text class="note" x="90" y="107">this was checked against nominal/estimated numbers, not physical measurements.</text>
  <text class="note" x="90" y="112">Small solid black dots mark the exact center of every drilled hole — center-punch</text>
  <text class="note" x="90" y="117">through those, not by eyeing the circle.</text>

  <!-- ============ Drill-bit legend ============ -->
  <g class="legend">
    <rect class="panel" x="0" y="120" width="222" height="16.5"/>
    <text class="hdr" x="3" y="125">Drill bit legend</text>
    <text x="3" y="130">USB coupler bore (1x, ⌀23.7mm) — ⌀24mm bit (step-drill #1 bit, 4-32mm)</text>
    <text x="3" y="134.5">USB coupler mounting screws (2x, ⌀3.4mm, M3) — ⌀3.5mm bit, or ⌀3mm if that's the closest you have</text>
  </g>
</svg>
