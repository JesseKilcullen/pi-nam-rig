<svg xmlns="http://www.w3.org/2000/svg" width="222mm" height="270mm" viewBox="0 0 222 270">
  <!-- REV 5 — 2026-09-12 — PRINT THIS AT 100% / "ACTUAL SIZE" — NOT "FIT TO PAGE".
       After printing, measure the 50mm calibration bar at the bottom with a
       ruler. If it doesn't measure exactly 50mm, your printer rescaled the
       page — fix print settings before using this as a drill template.

       Coordinate system matches pipedal-hardware-v2.md §2.1/§2.2:
       origin = back-left corner of the panel, X = across the 222mm width,
       Y = front-to-back across the 146mm depth. Solid black dots mark the exact
       center of each hole for center-punching.

       CORNER-POST FIX (§2.1): the physical HB5050 chassis has a full-height internal boss at
       each corner for a lid-mounting screw, asymmetric per corner (diagonal) — TUNER/MUTE and
       SW4's corners have the BIG post (13x22mm), RESET and SNAPSHOT's corners have the SMALL
       post (11x11mm). RESET moved 20->22, TUNER/MUTE moved 202->198 to clear theirs; SW4 and
       SNAPSHOT already cleared without moving. Both LEDs moved to X=177 (left of their switch)
       by request, for visual symmetry between the rows — not required by any clearance.

       All hole diameters and positions per pipedal-hardware-v2.md §2.1,
       plus the preset-browse rotary encoder from §4.2 (X=55, Y=52, same Y as the OLED's
       center, in the open gap between it and RESET).
       Panel-thickness/box-depth assumptions in §2.3 are NOT re-verified
       here — this is a 2D hole-position template only. -->

  <style>
    text { font-family: sans-serif; }
    .hole { fill: none; stroke: black; stroke-width: 0.3; }
    .panel { fill: none; stroke: black; stroke-width: 0.5; }
    .dim { stroke: black; stroke-width: 0.15; }
    .dimtext { font-size: 3.2px; fill: black; }
    .label { font-size: 3px; fill: black; }
    .note { font-size: 3px; fill: black; }
    .bg { fill: white; }
    .punch { fill: black; }
    .ref { fill: none; stroke: black; stroke-width: 0.3; stroke-dasharray: 1.2,0.8; }
    .post { fill: #eeeeee; stroke: black; stroke-width: 0.2; stroke-dasharray: 0.8,0.8; }
    .legend text { font-size: 3px; fill: black; }
    .legend .hdr { font-size: 3.2px; font-weight: bold; }
  </style>

  <!-- panel outline, 222 x 146mm -->
  <rect class="panel" x="0" y="0" width="222" height="146"/>

  <!-- Corner post danger zones — diagonal: back-right(TUNER/MUTE)/front-left(SW4) = big
       (13x22), back-left(RESET)/front-right(SNAPSHOT) = small (11x11) -->
  <rect class="post" x="0" y="0" width="11" height="11"/>
  <rect class="post" x="209" y="0" width="13" height="22"/>
  <rect class="post" x="0" y="124" width="13" height="22"/>
  <rect class="post" x="211" y="135" width="11" height="11"/>
  <text class="label" x="5.5" y="7" text-anchor="middle">post</text>
  <text class="label" x="215.5" y="16" text-anchor="middle">post</text>
  <text class="label" x="6.5" y="130" text-anchor="middle">post</text>
  <text class="label" x="216.5" y="142" text-anchor="middle">post</text>

  <!-- ============ HOLES ============ -->
  <!-- RESET, ⌀12mm, small-post corner. Dashed rect = actual 13.4x12.1mm square base (confirmed
       from the A-1874 datasheet, SF12N-0202-20R-M) — bigger than the round hole, shown on every
       switch below. Moved 20->22. -->
  <circle class="hole" cx="22" cy="15" r="6"/>
  <circle class="punch" cx="22" cy="15" r="0.4"/>
  <rect class="ref" x="15.3" y="8.95" width="13.4" height="12.1"/>
  <text class="label" x="22" y="6" text-anchor="middle">RESET ⌀12</text>

  <!-- TUNER/MUTE, ⌀12mm, big-post corner. Moved 202->198. -->
  <circle class="hole" cx="198" cy="15" r="6"/>
  <circle class="punch" cx="198" cy="15" r="0.4"/>
  <rect class="ref" x="191.3" y="8.95" width="13.4" height="12.1"/>
  <text class="label" x="198" y="6" text-anchor="middle">TUNER/MUTE ⌀12</text>

  <!-- USB coupler footprint, reference only — the actual connector is on the BACK WALL, not this
       panel, still at its original X=170. Shown here for X-Y cross-reference with
       pipedal-footswitch-backwall-drill-template.svg / pipedal-hardware-v2.md §2.3a, and to show
       its clearance to TUNER/MUTE directly. Y=0-28.6 is how far its body protrudes forward from
       the back wall into the box. -->
  <rect class="ref" x="157" y="0" width="26" height="28.6"/>
  <circle class="ref" cx="170" cy="14.3" r="11.85"/>
  <g class="dim">
    <line x1="157" y1="31" x2="157" y2="34"/>
    <line x1="183" y1="31" x2="183" y2="34"/>
    <line x1="157" y1="32.5" x2="183" y2="32.5"/>
  </g>
  <rect class="bg" x="161" y="30.8" width="18" height="3.4"/>
  <text class="dimtext" x="170" y="33.5" text-anchor="middle">26.0</text>
  <g class="dim">
    <line x1="186" y1="0" x2="189" y2="0"/>
    <line x1="186" y1="28.6" x2="189" y2="28.6"/>
    <line x1="187.5" y1="0" x2="187.5" y2="28.6"/>
  </g>
  <text class="dimtext" x="191" y="14.3" transform="rotate(-90 191 14.3)" text-anchor="middle">28.6</text>
  <text class="label" x="170" y="38" text-anchor="middle">USB coupler footprint</text>
  <text class="label" x="170" y="41.5" text-anchor="middle">(back wall, reference only)</text>
  <g class="dim">
    <line x1="183" y1="12" x2="183" y2="16.5"/>
    <line x1="191.3" y1="12" x2="191.3" y2="16.5"/>
    <line x1="183" y1="14.3" x2="191.3" y2="14.3"/>
  </g>
  <text class="dimtext" x="187.15" y="11" text-anchor="middle">8.3</text>

  <!-- Preset-browse rotary encoder, §4.2, ⌀7.1mm, same Y as OLED center -->
  <circle class="hole" cx="55" cy="52" r="3.55"/>
  <circle class="punch" cx="55" cy="52" r="0.4"/>
  <text class="label" x="55" y="63" text-anchor="middle">ENCODER ⌀7.1</text>

  <!-- OLED cutout, ~58x30mm, centered 111,52 — center marked for pilot-hole reference only,
       this is cut with a rotary tool, not drilled as a single round hole -->
  <rect class="hole" x="82" y="37" width="58" height="30"/>
  <line class="dim" x1="108" y1="52" x2="114" y2="52"/>
  <line class="dim" x1="111" y1="49" x2="111" y2="55"/>
  <text class="label" x="111" y="52" text-anchor="middle">OLED cutout ~58x30</text>
  <text class="label" x="111" y="58" text-anchor="middle">(center ref only — cut, not drilled)</text>

  <!-- OLED mounting holes, ⌀3mm, at 68.0 x 38.8mm spacing centered on 111,52 -->
  <circle class="hole" cx="77" cy="32.6" r="1.5"/>
  <circle class="punch" cx="77" cy="32.6" r="0.4"/>
  <circle class="hole" cx="145" cy="32.6" r="1.5"/>
  <circle class="punch" cx="145" cy="32.6" r="0.4"/>
  <circle class="hole" cx="77" cy="71.4" r="1.5"/>
  <circle class="punch" cx="77" cy="71.4" r="0.4"/>
  <circle class="hole" cx="145" cy="71.4" r="1.5"/>
  <circle class="punch" cx="145" cy="71.4" r="0.4"/>
  <text class="label" x="77" y="29.5" text-anchor="middle">⌀3</text>
  <text class="label" x="145" y="29.5" text-anchor="middle">⌀3</text>

  <!-- Row A: SW1, SW2, SW3, LED, PRESET — Y=88. LED moved to X=177 (left of PRESET), by request
       for symmetry with row B — no corner conflict at Y=88, this move was optional. -->
  <circle class="hole" cx="28.5" cy="88" r="6"/>
  <circle class="punch" cx="28.5" cy="88" r="0.4"/>
  <rect class="ref" x="21.8" y="81.95" width="13.4" height="12.1"/>
  <text class="label" x="28.5" y="80" text-anchor="middle">SW1 ⌀12</text>
  <circle class="hole" cx="83.5" cy="88" r="6"/>
  <circle class="punch" cx="83.5" cy="88" r="0.4"/>
  <rect class="ref" x="76.8" y="81.95" width="13.4" height="12.1"/>
  <text class="label" x="83.5" y="80" text-anchor="middle">SW2 ⌀12</text>
  <circle class="hole" cx="138.5" cy="88" r="6"/>
  <circle class="punch" cx="138.5" cy="88" r="0.4"/>
  <rect class="ref" x="131.8" y="81.95" width="13.4" height="12.1"/>
  <text class="label" x="138.5" y="80" text-anchor="middle">SW3 ⌀12</text>
  <circle class="hole" cx="177" cy="88" r="2.5"/>
  <circle class="punch" cx="177" cy="88" r="0.4"/>
  <text class="label" x="177" y="80" text-anchor="middle">⌀5</text>
  <circle class="hole" cx="193.5" cy="88" r="6"/>
  <circle class="punch" cx="193.5" cy="88" r="0.4"/>
  <rect class="ref" x="186.8" y="81.95" width="13.4" height="12.1"/>
  <text class="label" x="193.5" y="80" text-anchor="middle">PRESET ⌀12</text>

  <!-- Row B: SW4, SW5, SW6, LED, SNAPSHOT — Y=128. SW4 and SNAPSHOT unchanged (small/big
       posts respectively already clear them); LED moved to X=177 for symmetry. -->
  <circle class="hole" cx="28.5" cy="128" r="6"/>
  <circle class="punch" cx="28.5" cy="128" r="0.4"/>
  <rect class="ref" x="21.8" y="121.95" width="13.4" height="12.1"/>
  <text class="label" x="28.5" y="138" text-anchor="middle">SW4 ⌀12</text>
  <circle class="hole" cx="83.5" cy="128" r="6"/>
  <circle class="punch" cx="83.5" cy="128" r="0.4"/>
  <rect class="ref" x="76.8" y="121.95" width="13.4" height="12.1"/>
  <text class="label" x="83.5" y="138" text-anchor="middle">SW5 ⌀12</text>
  <circle class="hole" cx="138.5" cy="128" r="6"/>
  <circle class="punch" cx="138.5" cy="128" r="0.4"/>
  <rect class="ref" x="131.8" y="121.95" width="13.4" height="12.1"/>
  <text class="label" x="138.5" y="138" text-anchor="middle">SW6 ⌀12</text>
  <circle class="hole" cx="177" cy="128" r="2.5"/>
  <circle class="punch" cx="177" cy="128" r="0.4"/>
  <text class="label" x="177" y="138" text-anchor="middle">⌀5</text>
  <circle class="hole" cx="193.5" cy="128" r="6"/>
  <circle class="punch" cx="193.5" cy="128" r="0.4"/>
  <rect class="ref" x="186.8" y="121.95" width="13.4" height="12.1"/>
  <text class="label" x="193.5" y="138" text-anchor="middle">SNAPSHOT ⌀12</text>

  <!-- ============ DIMENSION LINES: row A ============ -->
  <g class="dim">
    <line x1="0" y1="93" x2="0" y2="101"/>
    <line x1="0" y1="97" x2="28.5" y2="97"/>
    <line x1="28.5" y1="95" x2="28.5" y2="99"/>
    <line x1="83.5" y1="95" x2="83.5" y2="99"/>
    <line x1="28.5" y1="97" x2="83.5" y2="97"/>
    <line x1="138.5" y1="95" x2="138.5" y2="99"/>
    <line x1="83.5" y1="97" x2="138.5" y2="97"/>
    <line x1="177" y1="95" x2="177" y2="99"/>
    <line x1="138.5" y1="97" x2="177" y2="97"/>
    <line x1="193.5" y1="95" x2="193.5" y2="99"/>
    <line x1="177" y1="97" x2="193.5" y2="97"/>
  </g>
  <rect class="bg" x="11" y="95.3" width="16" height="3.4"/>
  <text class="dimtext" x="19" y="98" text-anchor="middle">28.5</text>
  <rect class="bg" x="47" y="95.3" width="18" height="3.4"/>
  <text class="dimtext" x="56" y="98" text-anchor="middle">55.0</text>
  <rect class="bg" x="102" y="95.3" width="18" height="3.4"/>
  <text class="dimtext" x="111" y="98" text-anchor="middle">55.0</text>
  <rect class="bg" x="149" y="95.3" width="16" height="3.4"/>
  <text class="dimtext" x="157.75" y="98" text-anchor="middle">38.5</text>
  <rect class="bg" x="177" y="95.3" width="16" height="3.4"/>
  <text class="dimtext" x="185.25" y="98" text-anchor="middle">16.5</text>

  <!-- ============ Row B dimension chain — matches row A ============ -->
  <g class="dim">
    <line x1="0" y1="115" x2="0" y2="123"/>
    <line x1="0" y1="119" x2="28.5" y2="119"/>
    <line x1="28.5" y1="115" x2="28.5" y2="123"/>
    <line x1="83.5" y1="115" x2="83.5" y2="123"/>
    <line x1="28.5" y1="119" x2="83.5" y2="119"/>
    <line x1="138.5" y1="115" x2="138.5" y2="123"/>
    <line x1="83.5" y1="119" x2="138.5" y2="119"/>
    <line x1="177" y1="115" x2="177" y2="123"/>
    <line x1="138.5" y1="119" x2="177" y2="119"/>
    <line x1="193.5" y1="115" x2="193.5" y2="123"/>
    <line x1="177" y1="119" x2="193.5" y2="119"/>
  </g>
  <rect class="bg" x="11" y="117.3" width="16" height="3.4"/>
  <text class="dimtext" x="19" y="120" text-anchor="middle">28.5</text>
  <rect class="bg" x="47" y="117.3" width="18" height="3.4"/>
  <text class="dimtext" x="56" y="120" text-anchor="middle">55.0</text>
  <rect class="bg" x="102" y="117.3" width="18" height="3.4"/>
  <text class="dimtext" x="111" y="120" text-anchor="middle">55.0</text>
  <rect class="bg" x="149" y="117.3" width="16" height="3.4"/>
  <text class="dimtext" x="157.75" y="120" text-anchor="middle">38.5</text>
  <rect class="bg" x="177" y="117.3" width="16" height="3.4"/>
  <text class="dimtext" x="185.25" y="120" text-anchor="middle">16.5</text>

  <!-- ============ DIMENSION LINES: vertical, down the left margin ============ -->
  <g class="dim">
    <line x1="8" y1="0" x2="12" y2="0"/>
    <line x1="8" y1="15" x2="12" y2="15"/>
    <line x1="10" y1="0" x2="10" y2="15"/>
    <line x1="8" y1="52" x2="12" y2="52"/>
    <line x1="10" y1="15" x2="10" y2="52"/>
    <line x1="8" y1="88" x2="12" y2="88"/>
    <line x1="10" y1="52" x2="10" y2="88"/>
    <line x1="8" y1="128" x2="12" y2="128"/>
    <line x1="10" y1="88" x2="10" y2="128"/>
    <line x1="8" y1="146" x2="12" y2="146"/>
    <line x1="10" y1="128" x2="10" y2="146"/>
  </g>
  <rect class="bg" x="1" y="5.8" width="9" height="3.4"/>
  <text class="dimtext" x="5.5" y="8.5" text-anchor="middle">15.0</text>
  <rect class="bg" x="1" y="31.5" width="9" height="3.4"/>
  <text class="dimtext" x="5.5" y="34.2" text-anchor="middle">37.0</text>
  <rect class="bg" x="1" y="68" width="9" height="3.4"/>
  <text class="dimtext" x="5.5" y="70.7" text-anchor="middle">36.0</text>
  <rect class="bg" x="1" y="106" width="9" height="3.4"/>
  <text class="dimtext" x="5.5" y="108.7" text-anchor="middle">40.0</text>
  <rect class="bg" x="1" y="135.3" width="9" height="3.4"/>
  <text class="dimtext" x="5.5" y="138" text-anchor="middle">18.0</text>

  <!-- ============ OLED hole spacing dims ============ -->
  <g class="dim">
    <line x1="77" y1="24" x2="77" y2="30.6"/>
    <line x1="145" y1="24" x2="145" y2="30.6"/>
    <line x1="77" y1="26" x2="145" y2="26"/>
  </g>
  <rect class="bg" x="101" y="24.3" width="20" height="3.4"/>
  <text class="dimtext" x="111" y="27" text-anchor="middle">68.0</text>
  <g class="dim">
    <line x1="150" y1="32.6" x2="156" y2="32.6"/>
    <line x1="150" y1="71.4" x2="156" y2="71.4"/>
    <line x1="153" y1="32.6" x2="153" y2="71.4"/>
  </g>
  <text class="dimtext" x="156.5" y="53.3">38.8</text>

  <!-- ============ Encoder X position + note about shared Y ============ -->
  <g class="dim">
    <line x1="0" y1="45" x2="55" y2="45"/>
    <line x1="0" y1="43" x2="0" y2="47"/>
    <line x1="55" y1="43" x2="55" y2="47"/>
  </g>
  <rect class="bg" x="20" y="43.3" width="14" height="3.4"/>
  <text class="dimtext" x="27" y="46" text-anchor="middle">55.0</text>
  <text class="label" x="55" y="41" text-anchor="middle">(Y=52, same as OLED center)</text>

  <!-- ============ Back-corner margins (RESET/TUNER-MUTE to nearest edge) — 22.0/24.0, asymmetric
       per the corrected corner-post diagonal ============ -->
  <g class="dim">
    <line x1="0" y1="4" x2="22" y2="4"/>
    <line x1="0" y1="2" x2="0" y2="6"/>
    <line x1="22" y1="2" x2="22" y2="6"/>
  </g>
  <text class="dimtext" x="11" y="3" text-anchor="middle">22.0</text>
  <g class="dim">
    <line x1="198" y1="4" x2="222" y2="4"/>
    <line x1="198" y1="2" x2="198" y2="6"/>
    <line x1="222" y1="2" x2="222" y2="6"/>
  </g>
  <text class="dimtext" x="210" y="3" text-anchor="middle">24.0</text>

  <!-- ============ Calibration bar + notes, below the panel ============ -->
  <line x1="20" y1="160" x2="70" y2="160" stroke="black" stroke-width="0.5"/>
  <line x1="20" y1="157" x2="20" y2="163" stroke="black" stroke-width="0.5"/>
  <line x1="70" y1="157" x2="70" y2="163" stroke="black" stroke-width="0.5"/>
  <text class="note" x="45" y="167" text-anchor="middle">50mm — measure this line after printing to confirm scale</text>

  <text class="note" x="90" y="158">All hole positions are center-to-center from the</text>
  <text class="note" x="90" y="163">back-left corner (0,0) — see pipedal-hardware-v2.md §2.1</text>
  <text class="note" x="90" y="168">for the same coordinates as a table. Cut this template to</text>
  <text class="note" x="90" y="173">match your ACTUAL panel size before marking anything —</text>
  <text class="note" x="90" y="178">nominal box dimensions, not a measurement of your lid.</text>
  <text class="note" x="90" y="183">Small solid black dots mark the exact center of every drilled</text>
  <text class="note" x="90" y="188">hole — center-punch through those, not by eyeing the circle.</text>

  <!-- ============ Drill-bit legend ============ -->
  <g class="legend">
    <rect class="panel" x="0" y="193" width="222" height="76"/>
    <text class="hdr" x="3" y="198">Drill bit legend</text>
    <text x="3" y="203">RESET, TUNER/MUTE, SW1-6, PRESET, SNAPSHOT (10x, ⌀12mm body) — ⌀12mm bit (step-drill #1 bit, 4-32mm)</text>
    <text x="3" y="207.5">PRESET LED, SNAPSHOT LED (2x, ⌀5mm) — ⌀5mm bit</text>
    <text x="3" y="212">OLED mounting holes (4x, ⌀3mm, M3) — ⌀3mm bit. Check the OLED module's box first — many ship</text>
    <text x="3" y="216.5">with their own M3 screws/standoffs; only buy separate hardware if none came with it.</text>
    <text x="3" y="221">Preset-browse encoder (1x, ⌀7.1mm) — closest bit in a metric HSS set is ⌀7mm; the encoder's</text>
    <text x="3" y="225.5">own nut/washer covers the ~0.1mm slop, no reaming needed.</text>
    <text x="3" y="230">OLED viewing window (~58x30mm) — not a drill bit: drill a ⌀3-4mm pilot hole inside the waste</text>
    <text x="3" y="234.5">area, cut with a rotary tool + cutting disc, then file/sand to the line.</text>
    <text x="3" y="241">Dashed squares (13.4x12.1mm) on every switch: the ACTUAL base, confirmed from the A-1874</text>
    <text x="3" y="245.5">datasheet (SF12N-0202-20R-M) — bigger than the ⌀12mm hole, and it sits on the front/outside</text>
    <text x="3" y="250">face (not inside the box). Not keyed to the round hole, so you can rotate each switch to</text>
    <text x="3" y="254.5">whichever angle clears its neighbours best.</text>
    <text x="3" y="259">Shaded "post" zones (corners): full-height internal lid-mounting bosses inside the physical</text>
    <text x="3" y="263.5">chassis, confirmed by opening it — diagonal, big (13x22mm) at TUNER/MUTE/SW4, small (11x11mm)</text>
    <text x="3" y="268">at RESET/SNAPSHOT. RESET and TUNER/MUTE moved to clear theirs; see pipedal-hardware-v2.md §2.1.</text>
  </g>
</svg>
