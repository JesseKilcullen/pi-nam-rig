<svg xmlns="http://www.w3.org/2000/svg" width="222mm" height="80mm" viewBox="0 0 222 80">
  <!-- REV 5 — 2026-09-12: connector stays at true X=170 (its ORIGINAL position) — corrected the
       corner-post diagonal (TUNER/MUTE and SW4 have the big post, not RESET/SNAPSHOT as first
       assumed), so TUNER/MUTE on the lid moves a bit more than Rev 4 thought (202->198, not 200),
       but the gap this connector sits in is still comfortable. See
       pipedal-hardware-v2.md §2.1/§2.3a. Clearance ~10mm to the OLED, ~9mm to TUNER/MUTE.

       Mirrored X vs the lid (page position = 222 - true X) — standalone sheet, viewed from
       OUTSIDE the enclosure standing behind it, facing the opposite direction to the lid's own
       front-facing convention. -->
  <style>
    text { font-family: sans-serif; }
    .hole { fill: none; stroke: black; stroke-width: 0.3; }
    .panel { fill: none; stroke: black; stroke-width: 0.5; }
    .dim { stroke: black; stroke-width: 0.15; }
    .dimtext { font-size: 3.2px; fill: black; }
    .label { font-size: 3px; fill: black; }
    .note { font-size: 3px; fill: black; }
    .bg { fill: white; }
    .punch { fill: black; }
    .ref { fill: none; stroke: black; stroke-width: 0.3; stroke-dasharray: 1.2,0.8; }
  </style>

  <rect class="panel" x="0" y="0" width="222" height="55"/>

  <line class="dim" x1="52" y1="0" x2="52" y2="55" stroke-dasharray="1,1"/>
  <line class="dim" x1="0" y1="27.5" x2="222" y2="27.5" stroke-dasharray="1,1"/>

  <circle class="hole" cx="52" cy="27.5" r="11.85"/>
  <circle class="punch" cx="52" cy="27.5" r="0.4"/>
  <text class="label" x="40" y="10" text-anchor="start">USB coupler bore ⌀23.7 (true X=170)</text>

  <rect class="hole" x="39" y="12" width="26" height="31" stroke-dasharray="0.6,0.6"/>
  <text class="label" x="83" y="27.5" text-anchor="start">flange 26x31 (ref only,</text>
  <text class="label" x="83" y="31" text-anchor="start">not a cut line)</text>

  <circle class="hole" cx="42.5" cy="15.5" r="1.7"/>
  <circle class="punch" cx="42.5" cy="15.5" r="0.4"/>
  <circle class="hole" cx="61.5" cy="39.5" r="1.7"/>
  <circle class="punch" cx="61.5" cy="39.5" r="0.4"/>
  <text class="label" x="42.5" y="12.5" text-anchor="middle">⌀3.4</text>
  <text class="label" x="61.5" y="44" text-anchor="middle">⌀3.4</text>

  <g class="dim">
    <line x1="61.5" y1="44" x2="61.5" y2="47"/>
    <line x1="42.5" y1="44" x2="42.5" y2="47"/>
    <line x1="42.5" y1="45.5" x2="61.5" y2="45.5"/>
  </g>
  <rect class="bg" x="43" y="44" width="18" height="3.4"/>
  <text class="dimtext" x="52" y="46.7" text-anchor="middle">19.0</text>

  <g class="dim">
    <line x1="35" y1="15.5" x2="32" y2="15.5"/>
    <line x1="35" y1="39.5" x2="32" y2="39.5"/>
    <line x1="33.5" y1="15.5" x2="33.5" y2="39.5"/>
  </g>
  <text class="dimtext" x="31" y="28.5" text-anchor="end">24.0</text>

  <g class="dim">
    <line x1="218" y1="5" x2="52" y2="5"/>
    <line x1="218" y1="3" x2="218" y2="7"/>
    <line x1="52" y1="3" x2="52" y2="7"/>
  </g>
  <rect class="bg" x="129" y="3.3" width="16" height="3.4"/>
  <text class="dimtext" x="137" y="6" text-anchor="middle">170.0</text>

  <g class="dim">
    <line x1="10" y1="0" x2="10" y2="27.5"/>
    <line x1="8" y1="0" x2="12" y2="0"/>
    <line x1="8" y1="27.5" x2="12" y2="27.5"/>
  </g>
  <rect class="bg" x="4.5" y="12" width="11" height="3.4"/>
  <text class="dimtext" x="10" y="14.7" text-anchor="middle">27.5</text>

  <!-- ============ TUNER/MUTE profile, projected from the LID (reference only, not on this
       panel) — shows the X (mirrored, true X=198 -> page X=24) and Z extent of its below-panel
       stack, to directly confirm it doesn't reach the coupler. Page_y = 55 - Z (top of drawing =
       lid/hinge at Z=55, bottom = floor at Z=0). Only the body (Z39-52, radius 6mm, matching the
       round thread/hole) is close enough in Z to matter — the wider washer (Z52-55) sits well
       above the coupler's own Z-range and never gets close in this view. -->
  <rect class="ref" x="16" y="0" width="16" height="3"/>
  <rect class="ref" x="18" y="3" width="12" height="13"/>
  <rect class="ref" x="21" y="16" width="6" height="4"/>
  <text class="label" x="1" y="32" text-anchor="start">TUNER/MUTE</text>
  <text class="label" x="1" y="35.5" text-anchor="start">(from lid, ref)</text>

  <!-- Clearance callout: TUNER/MUTE body edge (30) to coupler flange edge (39) = 9mm -->
  <g class="dim">
    <line x1="30" y1="20" x2="30" y2="23"/>
    <line x1="39" y1="20" x2="39" y2="23"/>
    <line x1="30" y1="21.5" x2="39" y2="21.5"/>
  </g>
  <text class="dimtext" x="34.5" y="19" text-anchor="middle">9.0</text>

  <!-- ============ Calibration bar ============ -->
  <line x1="20" y1="65" x2="70" y2="65" stroke="black" stroke-width="0.5"/>
  <line x1="20" y1="62" x2="20" y2="68" stroke="black" stroke-width="0.5"/>
  <line x1="70" y1="62" x2="70" y2="68" stroke="black" stroke-width="0.5"/>
  <text class="note" x="45" y="73" text-anchor="middle">50mm</text>
</svg>
