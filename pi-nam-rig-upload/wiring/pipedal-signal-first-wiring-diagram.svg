<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -18 480 220" font-family="Arial, sans-serif">

  <text x="230" y="-6" text-anchor="middle" font-size="8" font-weight="bold">Lug/pin positions — footswitches, OLED, encoder (signal-first pass)</text>
  <text x="230" y="1" text-anchor="middle" font-size="3.6" fill="#666">Ground/common pins here get a capped tail, not joined to anything yet — see pipedal-signal-first-wiring-guide.md</text>

  <!-- ================= PANEL 1: SWITCH LUGS ================= -->
  <rect x="0" y="10" width="145" height="185" fill="none" stroke="#999" stroke-width="0.4"/>
  <text x="72" y="18" text-anchor="middle" font-size="5.5" font-weight="bold">Footswitch — 6 lugs, 2 used</text>
  <text x="72" y="24" text-anchor="middle" font-size="3" fill="#1a7a1a">Confirmed: face stamped "M 1 2 3" — M is the</text>
  <text x="72" y="28.5" text-anchor="middle" font-size="3" fill="#1a7a1a">body-length code, 1/2/3 are real pin numbers.</text>

  <!-- switch body underside -->
  <circle cx="72" cy="60" r="20" fill="#fbfbfb" stroke="#000" stroke-width="0.6"/>
  <text x="72" y="38" text-anchor="middle" font-size="3" fill="#666">switch body (underside)</text>

  <!-- marked face: row 1 -->
  <circle cx="58" cy="55" r="3" fill="none" stroke="#1a7a1a" stroke-width="0.9"/>
  <text x="58" y="56.2" text-anchor="middle" font-size="3.4" fill="#1a7a1a" font-weight="bold">1</text>
  <circle cx="72" cy="55" r="3" fill="none" stroke="#1a7a1a" stroke-width="0.9"/>
  <text x="72" y="56.2" text-anchor="middle" font-size="3.4" fill="#1a7a1a" font-weight="bold">2</text>
  <circle cx="86" cy="55" r="3" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="86" y="56.2" text-anchor="middle" font-size="3.4">3</text>

  <!-- opposite pole: row 2 -->
  <circle cx="58" cy="69" r="3" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="58" y="70.2" text-anchor="middle" font-size="3.4">1'</text>
  <circle cx="72" cy="69" r="3" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="72" y="70.2" text-anchor="middle" font-size="3.4">2'</text>
  <circle cx="86" cy="69" r="3" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="86" y="70.2" text-anchor="middle" font-size="3.4">3'</text>

  <text x="58" y="49" text-anchor="middle" font-size="3" fill="#1a7a1a" font-weight="bold">COM</text>
  <text x="72" y="49" text-anchor="middle" font-size="3" fill="#1a7a1a" font-weight="bold">NO</text>
  <text x="86" y="49" text-anchor="middle" font-size="3" fill="#666">NC (unused)</text>
  <text x="72" y="86" text-anchor="middle" font-size="3" fill="#666">opposite pole — all 3 unused</text>

  <!-- wires out -->
  <line x1="58" y1="52" x2="20" y2="30" stroke="#d21e1e" stroke-width="0.7"/>
  <text x="18" y="27" text-anchor="end" font-size="3.2" fill="#d21e1e" font-weight="bold">lug 1 / COM → GPx now</text>
  <text x="18" y="32" text-anchor="end" font-size="2.8" fill="#666">(soldered, plug into Pico)</text>

  <line x1="72" y1="52" x2="124" y2="30" stroke="#000" stroke-width="0.7" stroke-dasharray="1.5,1"/>
  <text x="126" y="27" text-anchor="start" font-size="3.2" font-weight="bold">lug 2 / NO → capped tail</text>
  <text x="126" y="32" text-anchor="start" font-size="2.8" fill="#666">(soldered, NOT joined yet)</text>

  <text x="72" y="100" text-anchor="middle" font-size="3.4" font-weight="bold">No marking? Multimeter, unpressed:</text>
  <text x="72" y="105" text-anchor="middle" font-size="3">try lug pairs until one goes open→closed</text>
  <text x="72" y="109.5" text-anchor="middle" font-size="3">while held pressed — that's COM+NO.</text>

  <text x="72" y="122" text-anchor="middle" font-size="3.6" font-weight="bold">Distance to Pico (this pass):</text>
  <text x="72" y="128" text-anchor="middle" font-size="3">RESET, SW1: ~50-90mm</text>
  <text x="72" y="133" text-anchor="middle" font-size="3">SW2, SW3, SW4, SW5: ~90-140mm</text>
  <text x="72" y="138" text-anchor="middle" font-size="3">SW6, PRESET, SNAPSHOT: ~140-200mm</text>
  <text x="72" y="143" text-anchor="middle" font-size="3">TUNER/MUTE: ~150-160mm</text>
  <text x="72" y="149" text-anchor="middle" font-size="3" fill="#666">All fit a 300mm F-F jumper — no cutting needed.</text>
  <text x="72" y="154.5" text-anchor="middle" font-size="2.8" fill="#c0392b">Estimate only — assumes Pico on the back wall,</text>
  <text x="72" y="159" text-anchor="middle" font-size="2.8" fill="#c0392b">encoder side. Not yet confirmed from your photo.</text>

  <text x="72" y="170" text-anchor="middle" font-size="3">Repeat ×10: SW1-6, PRESET, SNAPSHOT,</text>
  <text x="72" y="175" text-anchor="middle" font-size="3">RESET, TUNER/MUTE — same 2 lugs each time.</text>
  <text x="72" y="182" text-anchor="middle" font-size="2.8" fill="#666">Layout is generic/illustrative — bezel isn't</text>
  <text x="72" y="187" text-anchor="middle" font-size="2.8" fill="#666">keyed, so it can seat at any rotation.</text>

  <!-- ================= PANEL 2: OLED ================= -->
  <rect x="155" y="10" width="150" height="185" fill="none" stroke="#999" stroke-width="0.4"/>
  <text x="230" y="18" text-anchor="middle" font-size="5.5" font-weight="bold">OLED — 7 pins, all wired now</text>
  <text x="230" y="24" text-anchor="middle" font-size="3" fill="#c0392b">Pin order below is illustrative — read YOUR board's</text>
  <text x="230" y="28.5" text-anchor="middle" font-size="3" fill="#c0392b">printed silkscreen labels, not this position.</text>

  <rect x="175" y="36" width="70" height="30" fill="#fbfbfb" stroke="#000" stroke-width="0.6"/>
  <text x="210" y="50" text-anchor="middle" font-size="3.2">OLED module</text>
  <text x="210" y="55" text-anchor="middle" font-size="2.8" fill="#666">2.42" SSD1309</text>

  <g font-size="2.6">
    <circle cx="180" cy="66" r="1.6" fill="none" stroke="#000" stroke-width="0.4"/>
    <circle cx="192" cy="66" r="1.6" fill="none" stroke="#e07b00" stroke-width="0.7"/>
    <circle cx="204" cy="66" r="1.6" fill="none" stroke="#000" stroke-width="0.4"/>
    <circle cx="216" cy="66" r="1.6" fill="none" stroke="#000" stroke-width="0.4"/>
    <circle cx="228" cy="66" r="1.6" fill="none" stroke="#000" stroke-width="0.4"/>
    <circle cx="240" cy="66" r="1.6" fill="none" stroke="#000" stroke-width="0.4"/>
    <circle cx="252" cy="66" r="1.6" fill="none" stroke="#000" stroke-width="0.4"/>
  </g>
  <text x="180" y="73" text-anchor="middle" font-size="2.8">GND</text>
  <text x="192" y="73" text-anchor="middle" font-size="2.8" fill="#e07b00" font-weight="bold">VCC</text>
  <text x="204" y="73" text-anchor="middle" font-size="2.8">SCL</text>
  <text x="216" y="73" text-anchor="middle" font-size="2.8">SDA</text>
  <text x="228" y="73" text-anchor="middle" font-size="2.8">RES</text>
  <text x="240" y="73" text-anchor="middle" font-size="2.8">DC</text>
  <text x="252" y="73" text-anchor="middle" font-size="2.8">CS</text>

  <rect x="178" y="80" width="104" height="46" fill="#eef6ff" stroke="#1a6ec1" stroke-width="0.5"/>
  <text x="230" y="86" text-anchor="middle" font-size="3.2" font-weight="bold">Pico target — match by label</text>
  <text x="182" y="93" font-size="2.9">GND  →  GND</text>
  <text x="182" y="99" font-size="2.9" fill="#e07b00" font-weight="bold">VCC  →  3V3(OUT) — 3.3V ONLY</text>
  <text x="182" y="105" font-size="2.9">SCL  →  GP14 (SPI0 SCK)</text>
  <text x="182" y="111" font-size="2.9">SDA  →  GP15 (SPI0 MOSI)</text>
  <text x="182" y="117" font-size="2.9">RES  →  GP16</text>
  <text x="182" y="123" font-size="2.9">DC → GP17, CS → GP18</text>

  <text x="230" y="134" text-anchor="middle" font-size="3.4" font-weight="bold">Fully plug-in — no soldering at all.</text>
  <text x="230" y="140" text-anchor="middle" font-size="3">7-of-10-conductor ribbon jumper, both</text>
  <text x="230" y="145" text-anchor="middle" font-size="3">ends plug straight onto headers.</text>
  <text x="230" y="151" text-anchor="middle" font-size="3">Ground here goes to its OWN Pico GND</text>
  <text x="230" y="156" text-anchor="middle" font-size="3">pin — never through the bus.</text>

  <text x="230" y="166" text-anchor="middle" font-size="3.4" font-weight="bold">Distance to Pico: ~90-100mm</text>
  <text x="230" y="171.5" text-anchor="middle" font-size="3" fill="#c0392b">15cm ribbon is now tight (Pico moved to</text>
  <text x="230" y="176.5" text-anchor="middle" font-size="3" fill="#c0392b">the wall) — a 20cm ribbon is safer.</text>
  <text x="230" y="184" text-anchor="middle" font-size="2.8" fill="#c0392b" font-weight="bold">The one wire that can damage the display:</text>
  <text x="230" y="189" text-anchor="middle" font-size="2.8" fill="#c0392b" font-weight="bold">VCC → 3V3(OUT), never VBUS/5V.</text>

  <!-- ================= PANEL 3: ENCODER ================= -->
  <rect x="315" y="10" width="150" height="185" fill="none" stroke="#999" stroke-width="0.4"/>
  <text x="390" y="18" text-anchor="middle" font-size="5.5" font-weight="bold">Encoder — 5 pins, all named on the part</text>
  <text x="390" y="24" text-anchor="middle" font-size="3" fill="#666">Alpha RE111F (Tayda A-6329 / Jaycar SR1230)</text>

  <circle cx="390" cy="58" r="20" fill="#fbfbfb" stroke="#000" stroke-width="0.6"/>
  <text x="390" y="38" text-anchor="middle" font-size="3" fill="#666">encoder body (underside)</text>

  <!-- 5 pins around the body -->
  <circle cx="378" cy="50" r="2.6" fill="none" stroke="#d21e1e" stroke-width="0.8"/>
  <text x="378" y="51.2" text-anchor="middle" font-size="3" fill="#d21e1e" font-weight="bold">A</text>
  <circle cx="402" cy="50" r="2.6" fill="none" stroke="#d21e1e" stroke-width="0.8"/>
  <text x="402" y="51.2" text-anchor="middle" font-size="3" fill="#d21e1e" font-weight="bold">B</text>
  <circle cx="373" cy="63" r="2.6" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="373" y="64.2" text-anchor="middle" font-size="3">C</text>
  <circle cx="383" cy="72" r="2.6" fill="none" stroke="#d21e1e" stroke-width="0.8"/>
  <text x="383" y="73.2" text-anchor="middle" font-size="2.6" fill="#d21e1e" font-weight="bold">SW1</text>
  <circle cx="400" cy="72" r="2.6" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="400" y="73.2" text-anchor="middle" font-size="2.6">SW2</text>

  <text x="390" y="86" text-anchor="middle" font-size="2.8" fill="#666">A/B = quadrature signal · C = their shared ground</text>
  <text x="390" y="91" text-anchor="middle" font-size="2.8" fill="#666">SW1 = push-switch signal · SW2 = push-switch ground</text>

  <rect x="330" y="97" width="120" height="42" fill="#eef6ff" stroke="#1a6ec1" stroke-width="0.5"/>
  <text x="390" y="103" text-anchor="middle" font-size="3.2" font-weight="bold">Wire now (this pass)</text>
  <text x="334" y="110" font-size="2.9" fill="#d21e1e">A  → GP19 (signal, solder+plug)</text>
  <text x="334" y="116" font-size="2.9" fill="#d21e1e">B  → GP20 (signal, solder+plug)</text>
  <text x="334" y="122" font-size="2.9" fill="#d21e1e">SW1 → GP21 (signal, solder+plug)</text>
  <text x="334" y="131" font-size="2.9">C, SW2 → capped tails, join at</text>
  <text x="334" y="136" font-size="2.9">the bus later — same as switches</text>

  <text x="390" y="150" text-anchor="middle" font-size="3.4" font-weight="bold">Distance to Pico: ~90-110mm</text>
  <text x="390" y="155.5" text-anchor="middle" font-size="3">300mm F-F jumper — comfortable on A/B/SW1.</text>
  <text x="390" y="161" text-anchor="middle" font-size="3">Cut C/SW2 tails a bit long, trim to fit later.</text>

  <text x="390" y="172" text-anchor="middle" font-size="3">rotaryio (A/B) is hardware quadrature —</text>
  <text x="390" y="177" text-anchor="middle" font-size="3">only the push switch (SW1) shares the same</text>
  <text x="390" y="182" text-anchor="middle" font-size="3">debounce logic as the footswitches.</text>
  <text x="390" y="189" text-anchor="middle" font-size="2.8" fill="#c0392b">Estimate assumes Pico on the back wall,</text>
  <text x="390" y="194" text-anchor="middle" font-size="2.8" fill="#c0392b">encoder side — not yet confirmed from your photo.</text>

  <text x="0" y="205" font-size="3" fill="#444">Full detail: pipedal-signal-first-wiring-guide.md. Pin/wire table: pipedal-footswitch-wiring-reference.md.</text>

</svg>
